apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: aging-service-replicaset
  labels:
    app: aging-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: aging-service
  template:
    metadata:
      labels:
        app: aging-service
    spec:
      containers:
      - name: aging-container
        image: aging-service:1.0.1
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "250m"
            memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: aging-service-lb
spec:
  type: ClusterIP
  selector:
    app: aging-service
  ports:
  - port: 8080
    targetPort: 8080